<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- 셸 프롬프트(>_). 터미널 화면을 그대로 잘라 낸 것처럼 검은 타일 위에 흰 획을 얹는다.
         획만 있는 아이콘은 탭 스트립 바탕색에 따라 묻히지만, 타일이 제 바탕을 들고 다니면
         어디에 놓이든 같은 모양으로 선다. 그래서 타일 색은 테마와 무관하게 고정한다. -->

    <rect width="64" height="64" rx="6" fill="#121212"/>

    <!-- 좌표는 획의 중심선이고, 여백은 그 바깥으로 두께의 절반(1.5)이 더 붙는다.
         좌표가 좌우 대칭이라 두께를 바꿔도 타일 안 여백은 양쪽이 같게 유지된다. -->
    <g fill="none" stroke="#ffffff" stroke-width="3"
       stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.5 21 L30.5 32 L17.5 43"/>
        <path d="M35.5 43 H46.5"/>
    </g>
</svg>
